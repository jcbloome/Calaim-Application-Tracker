name: Proof of Income Age Reminders

on:
  workflow_dispatch:
  schedule:
    # 12:30 PM Eastern. 16:30 UTC is EDT; 17:30 UTC is EST.
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'

jobs:
  send-proof-income-age-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger proof of income age reminder cron
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X GET "$APP_BASE_URL/api/cron/proof-income-age-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
