name: Kaiser unassigned document digest

on:
  workflow_dispatch:

jobs:
  send-kaiser-unassigned-docs-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kaiser unassigned document digest
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required (example: https://connectcalaim.com)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X GET "$APP_BASE_URL/api/cron/kaiser-unassigned-docs-digest" \
            -H "Authorization: Bearer $CRON_SECRET"
