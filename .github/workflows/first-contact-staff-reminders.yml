name: First Contact Staff Reminders

on:
  workflow_dispatch:
  schedule:
    # Daily mid-morning Pacific (~1pm UTC)
    - cron: '0 13 * * *'

jobs:
  send-first-contact-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger first-contact staff reminder cron
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required (example: https://connectcalaim.com)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X GET "$APP_BASE_URL/api/cron/first-contact-staff-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
