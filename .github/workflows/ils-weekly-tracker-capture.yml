name: ILS Weekly Tracker Capture

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 8:00 AM EST (13:00 UTC), weekly.
    - cron: '0 13 * * 1'

jobs:
  capture-ils-weekly-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ILS weekly cron endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required (example: https://connectcalaim.com)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X GET "$APP_BASE_URL/api/cron/ils-weekly-list" \
            -H "Authorization: Bearer $CRON_SECRET"

