name: ALFT RN Reminders

on:
  workflow_dispatch:
  schedule:
    # Run twice daily for escalation reminders
    - cron: '0 13,21 * * *'

jobs:
  send-alft-rn-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ALFT RN reminder cron endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required (example: https://connectcalaim.com)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X GET "$APP_BASE_URL/api/cron/alft-rn-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"

