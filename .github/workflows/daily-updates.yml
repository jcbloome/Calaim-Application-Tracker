name: Daily Updates (Kaiser cache + application statuses)

on:
  workflow_dispatch:
  schedule:
    # ~4:30am PT (11:30 UTC). Listed with last-run results at /admin/tools/daily-updates.
    - cron: '30 11 * * *'

jobs:
  daily-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is required (example: https://connectcalaim.com)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi

      - name: Refresh Kaiser members + notes cache (batched)
        run: |
          offset=0
          while [ -n "$offset" ] && [ "$offset" != "null" ]; do
            echo "Batch offset=$offset"
            response=$(curl -fsS --max-time 320 -X GET \
              "$APP_BASE_URL/api/cron/kaiser-morning-notes-sync?offset=$offset&limit=150" \
              -H "Authorization: Bearer $CRON_SECRET")
            echo "$response" | jq -c '{success, offset, nextOffset, kaiserMembersInCache, batchMembers, notesSync: {syncedMembers: .notesSync.syncedMembers, failedMembers: .notesSync.failedMembers, totalNewNotes: .notesSync.totalNewNotes}}'
            offset=$(echo "$response" | jq -r '.nextOffset')
          done

      - name: Align application Kaiser / CalAIM status with Caspio
        if: always()
        run: |
          curl -fsS --max-time 320 -X GET "$APP_BASE_URL/api/cron/application-status-check" \
            -H "Authorization: Bearer $CRON_SECRET" | jq -c 'del(.changes)'
